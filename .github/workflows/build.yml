name: Build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  push:
    tags:
      - "*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{matrix.runner}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        if: matrix.os == 'ubuntu'
        uses: DeterminateSystems/determinate-nix-action@v3.23.2
      - name: Build (Nix, glibc 2.34)
        if: matrix.os == 'ubuntu'
        run: |
          nix build -L
          mkdir -p build/out
          cp -L result/lib/* build/out/
      - name: Configure and Build
        if: matrix.os != 'ubuntu'
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.os}}-build
          path: |
            ${{github.workspace}}/build/out/*
  release:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: artifacts/*
          generateReleaseNotes: true
          makeLatest: true
